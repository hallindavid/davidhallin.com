[build]
publish = "public"
command = "npm ci && npm run deploy"

[build.environment]
HUGO_VERSION = "0.161.1"
NODE_VERSION = "22"

[context.production.environment]
HUGO_ENV = "production"
HUGO_ENABLEGITINFO = "true"

[context.split1]
command = "npm ci && npm run prod && hugo --gc --minify --enableGitInfo"

[context.split1.environment]
HUGO_ENV = "production"

[context.deploy-preview]
command = "npm ci && npm run prod && hugo --gc --minify --buildFuture -b $DEPLOY_PRIME_URL"

[context.branch-deploy]
command = "npm ci && npm run prod && hugo --gc --minify -b $DEPLOY_PRIME_URL"

[context.next.environment]
HUGO_ENABLEGITINFO = "true"
